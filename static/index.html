<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Entity Link Agent</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:#1a1a1a;background:#f5f5f5;height:100vh;display:flex;flex-direction:column}
header{background:#fff;border-bottom:1px solid #e0e0e0;padding:0 24px;display:flex;align-items:center;gap:12px;height:48px;flex-shrink:0}
header h1{font-size:15px;font-weight:600}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;background:#f0f0f0;color:#888}
.tabs{display:flex;border-bottom:1px solid #e0e0e0;background:#fff;padding:0 24px;flex-shrink:0}
.tab{padding:10px 16px;cursor:pointer;font-size:13px;color:#666;border-bottom:2px solid transparent;margin-bottom:-1px;user-select:none}
.tab.active{color:#0066cc;border-bottom-color:#0066cc;font-weight:500}
.pane{flex:1;overflow:auto;padding:20px 24px;display:none}
.pane.active{display:flex;gap:20px;align-items:flex-start}
.panel{background:#fff;border:1px solid #e0e0e0;border-radius:6px;padding:16px;flex:1;min-width:0}
.panel h2{font-size:13px;font-weight:600;color:#333;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between}
label{display:block;font-size:12px;color:#555;margin:10px 0 4px}
label:first-of-type{margin-top:0}
input,textarea{width:100%;padding:7px 10px;border:1px solid #d0d0d0;border-radius:4px;font-size:13px;font-family:inherit;outline:none;color:#1a1a1a}
input:focus,textarea:focus{border-color:#0066cc;box-shadow:0 0 0 2px rgba(0,102,204,.1)}
textarea{resize:vertical;font-family:'Courier New',monospace;font-size:12px}
button{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border:none;border-radius:4px;cursor:pointer;font-size:13px;font-weight:500;transition:background .15s}
.btn-primary{background:#0066cc;color:#fff}
.btn-primary:hover{background:#0055aa}
.btn-primary:disabled{background:#aaa;cursor:not-allowed}
.btn-sm{padding:4px 10px;font-size:12px;background:#f0f0f0;color:#333;border:1px solid #d0d0d0;border-radius:4px}
.btn-sm:hover{background:#e0e0e0}
.result-box{margin-top:10px;padding:10px;background:#f8f8f8;border:1px solid #e0e0e0;border-radius:4px;font-size:12px;font-family:'Courier New',monospace;white-space:pre-wrap;word-break:break-all;max-height:220px;overflow:auto}
.result-box.ok{background:#f5fff8;border-color:#b0e0bc}
.result-box.err{background:#fff5f5;border-color:#f5c0c0;color:#c00}
.kb-item{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:#f8f8f8;border:1px solid #e8e8e8;border-radius:4px;margin-bottom:6px}
.kb-name{font-weight:500;font-size:13px}
.kb-meta{font-size:11px;color:#888;margin-top:2px}
.mention-card{padding:10px;border:1px solid #e0e0e0;border-radius:4px;margin-bottom:8px}
.mhead{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.status-badge{padding:2px 7px;border-radius:10px;font-size:11px;font-weight:600}
.linked{background:#e6f4ea;color:#1e7e34}
.nil{background:#f0f0f0;color:#666}
.ambiguous{background:#fff3cd;color:#856404}
.error{background:#f8d7da;color:#721c24}
.section-lbl{font-size:11px;color:#888;margin:6px 0 3px;text-transform:uppercase;letter-spacing:.5px}
.tag{display:inline-block;padding:1px 6px;background:#e8f0fe;color:#1a56db;border-radius:3px;font-size:11px;margin-right:3px}
.cand-row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid #f5f5f5}
.cand-row:last-child{border-bottom:none}
.evid-row{font-size:11px;color:#555;padding:2px 0}
.score-bar{display:inline-block;height:5px;background:#0066cc;border-radius:3px;margin-left:6px;vertical-align:middle}
.empty{color:#aaa;font-size:12px;text-align:center;padding:24px}
.coref-info{font-size:11px;color:#555;margin-bottom:4px}
.summary-row{display:flex;gap:16px;margin-bottom:12px;font-size:13px}
.chain-row{font-size:12px;padding:4px 0}
.hint{font-size:11px;color:#999;margin-top:4px}
</style>
</head>
<body>
<header>
  <h1>Entity Link Agent</h1>
  <span class="badge">v1</span>
  <span id="health" class="badge" style="margin-left:auto">检查中...</span>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('kb')">知识库管理</div>
  <div class="tab" onclick="switchTab('link')">实体链接</div>
</div>

<div id="pane-kb" class="pane active">
  <div class="panel" style="max-width:420px;flex:0 0 420px">
    <h2>导入知识库 <button class="btn-sm" onclick="fillPreset()">📋 填入示例</button></h2>
    <label>知识库 ID</label><input id="kb-id" placeholder="energy-v1">
    <label>版本</label><input id="kb-ver" value="v1">
    <label>描述</label><input id="kb-desc" placeholder="能源行业实体库">
    <label>实体列表（JSON 数组，含 entity_id / canonical_name / entity_type / aliases / description / keywords）</label>
    <textarea id="kb-entities" rows="12" placeholder='[{"entity_id":"E001","canonical_name":"...","entity_type":"ORG","aliases":["..."],"former_names":[],"description":"...","keywords":["..."]}]'></textarea>
    <div class="hint">同名 kb_id 再次导入将覆盖已有数据</div>
    <br>
    <button class="btn-primary" onclick="importKB()">📦 导入知识库</button>
    <div id="r-import"></div>
  </div>

  <div class="panel">
    <h2>知识库列表 <button class="btn-sm" onclick="loadKBs()">↺ 刷新</button></h2>
    <div id="kb-list"><div class="empty">暂无知识库</div></div>
  </div>
</div>

<div id="pane-link" class="pane">
  <div class="panel" style="max-width:500px;flex:0 0 500px">
    <h2>链接请求 <button class="btn-sm" onclick="fillLinkPreset()">📋 填入示例</button></h2>
    <label>请求体（完整的 LinkRequest JSON）</label>
    <textarea id="lk-json" rows="22" placeholder='{"schema_version":"v1","request_id":"req-001","text":{"content":"...","language":"zh"},"mentions":[{"mention_id":"m1","surface_form":"...","start_offset":0,"end_offset":6}],"knowledge_base":{"kb_id":"cn-enterprises-v1","kb_version":"v1"},"options":{"top_k":5,"nil_threshold":0.6,"enable_nil":true,"enable_coreference":true,"return_candidates":true,"return_evidence":true,"linker_version":"v1"}}'></textarea>
    <div class="hint">直接粘贴接口文档中的 LinkRequest JSON，或从 tests/fixtures/ 加载</div>
    <br>
    <button class="btn-primary" id="lk-btn" onclick="runLink()">▶ 执行链接</button>
    <div id="lk-err" style="color:#c00;font-size:12px;margin-top:6px;display:none"></div>
  </div>

  <div class="panel">
    <h2>链接结果</h2>
    <div id="lk-result"><div class="empty">发送请求后结果展示在此</div></div>
  </div>
</div>

<script>
// 自动检测：当前端口不是8000时，API请求指向后端
const API_BASE = window.location.port === '8000' ? '' : 'http://localhost:8000';

async function api(method, path, body) {
  const r = await fetch(API_BASE + path, {
    method,
    headers: {'Content-Type': 'application/json'},
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  return { ok: r.ok, data: await r.json() };
}

function showResult(id, { ok, data }) {
  const el = document.getElementById(id);
  el.className = 'result-box ' + (ok ? 'ok' : 'err');
  el.textContent = JSON.stringify(data, null, 2);
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', ['kb','link'][i] === name));
  document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
  document.getElementById('pane-' + name).classList.add('active');
  if (name === 'kb') loadKBs();
}

async function checkHealth() {
  const el = document.getElementById('health');
  try {
    const { ok } = await api('GET', '/health');
    el.textContent = ok ? '服务正常' : '服务异常';
    el.style.cssText = ok ? 'background:#e6f4ea;color:#1e7e34' : 'background:#fde8e8;color:#c00';
  } catch { el.textContent = '连接失败'; el.style.cssText = 'background:#fde8e8;color:#c00'; }
}

function fillPreset() {
  document.getElementById('kb-id').value = 'cn-enterprises-v1';
  document.getElementById('kb-ver').value = 'v1';
  document.getElementById('kb-desc').value = '中国企业实体库（演示用精简版，完整120条见 tests/fixtures/cn_enterprises_kb.json）';
  document.getElementById('kb-entities').value = JSON.stringify([
    {"entity_id":"E001","canonical_name":"国家电网有限公司","entity_type":"ORG","aliases":["国家电网","国网","SGCC"],"former_names":["国家电力公司"],"description":"中国规模最大的公用事业企业，负责全国大部分地区的电力输送与销售。","parent_ids":[],"keywords":["特高压","输电","电网","国有企业","电力"]},
    {"entity_id":"E016","canonical_name":"华为技术有限公司","entity_type":"ORG","aliases":["华为","Huawei"],"former_names":[],"description":"全球领先的ICT基础设施和智能终端提供商。","parent_ids":[],"keywords":["5G","通信设备","智能手机","芯片","云计算","鸿蒙"]},
    {"entity_id":"E018","canonical_name":"腾讯控股有限公司","entity_type":"ORG","aliases":["腾讯","Tencent"],"former_names":["深圳市腾讯计算机系统有限公司"],"description":"中国最大的互联网综合服务提供商。","parent_ids":[],"keywords":["社交","游戏","微信","QQ","云服务"]},
    {"entity_id":"E019","canonical_name":"阿里巴巴集团控股有限公司","entity_type":"ORG","aliases":["阿里巴巴","阿里","Alibaba"],"former_names":["阿里巴巴网络技术有限公司"],"description":"全球最大的零售商务公司。","parent_ids":[],"keywords":["电商","云计算","淘宝","天猫","支付宝"]},
    {"entity_id":"E036","canonical_name":"中国工商银行股份有限公司","entity_type":"ORG","aliases":["工商银行","工行","ICBC"],"former_names":["中国工商银行"],"description":"中国最大的商业银行。","parent_ids":[],"keywords":["银行","金融","信贷","零售银行"]},
    {"entity_id":"E042","canonical_name":"中国平安保险（集团）股份有限公司","entity_type":"ORG","aliases":["中国平安","平安","Ping An"],"former_names":["平安保险公司"],"description":"中国最大的综合金融服务集团。","parent_ids":[],"keywords":["保险","银行","金融科技","健康管理"]},
    {"entity_id":"E014","canonical_name":"宁德时代新能源科技股份有限公司","entity_type":"ORG","aliases":["宁德时代","CATL"],"former_names":[],"description":"全球领先的动力电池及储能系统研发制造企业。","parent_ids":[],"keywords":["动力电池","锂电池","储能","三元锂"]},
    {"entity_id":"E060","canonical_name":"长城汽车股份有限公司","entity_type":"ORG","aliases":["长城汽车","长城","GWM"],"former_names":["长城汽车制造厂"],"description":"中国最大的SUV和皮卡制造商。","parent_ids":[],"keywords":["SUV","皮卡","哈弗","坦克","新能源"]},
    {"entity_id":"E096","canonical_name":"贵州茅台酒股份有限公司","entity_type":"ORG","aliases":["贵州茅台","茅台","Moutai"],"former_names":["茅台酒厂"],"description":"中国最著名的高端白酒企业。","parent_ids":[],"keywords":["白酒","酱香","飞天茅台"]},
    {"entity_id":"E104","canonical_name":"中国移动通信集团有限公司","entity_type":"ORG","aliases":["中国移动","移动","China Mobile"],"former_names":["中国电信（香港）有限公司"],"description":"中国最大的电信运营商。","parent_ids":[],"keywords":["通信","5G","宽带","物联网"]}
  ], null, 2);
}

async function importKB() {
  const kbId = document.getElementById('kb-id').value.trim();
  if (!kbId) { const el=document.getElementById('r-import'); el.className='result-box err'; el.textContent='知识库 ID 不能为空'; return; }
  let entities;
  try { entities = JSON.parse(document.getElementById('kb-entities').value); }
  catch (e) { const el=document.getElementById('r-import'); el.className='result-box err'; el.textContent='JSON格式错误: '+e.message; return; }
  if (!Array.isArray(entities) || entities.length === 0) { const el=document.getElementById('r-import'); el.className='result-box err'; el.textContent='实体列表不能为空'; return; }
  const r = await api('POST', '/api/v1/knowledge-bases', {
    kb_id: kbId,
    kb_version: document.getElementById('kb-ver').value.trim() || 'v1',
    description: document.getElementById('kb-desc').value.trim(),
    entities,
  });
  showResult('r-import', r);
  if (r.ok) { loadKBs(); useKB(kbId, document.getElementById('kb-ver').value.trim() || 'v1'); }
}

async function loadKBs() {
  const { ok, data } = await api('GET', '/api/v1/knowledge-bases');
  const el = document.getElementById('kb-list');
  if (!ok || !data.knowledge_bases?.length) { el.innerHTML = '<div class="empty">暂无知识库，点击"填入示例"快速体验</div>'; return; }
  el.innerHTML = data.knowledge_bases.map(kb => `
    <div class="kb-item">
      <div>
        <div class="kb-name">${kb.kb_id}</div>
        <div class="kb-meta">${kb.description||'无描述'} · ${kb.kb_version} · ${kb.entity_count} 个实体</div>
      </div>
      <button class="btn-sm" onclick="useKB('${kb.kb_id}','${kb.kb_version}')">使用 →</button>
    </div>`).join('');
}

function useKB(id, ver) {
  const tmpl = JSON.stringify({
    schema_version: "v1", request_id: "req-" + Date.now(),
    text: { content: "", language: "zh" },
    mentions: [],
    knowledge_base: { kb_id: id, kb_version: ver },
    options: { top_k: 5, nil_threshold: 0.6, enable_nil: true, enable_coreference: true, return_candidates: true, return_evidence: true, linker_version: "v1" },
  }, null, 2);
  document.getElementById('lk-json').value = tmpl;
  switchTab('link');
}

function fillLinkPreset() {
  document.getElementById('lk-json').value = JSON.stringify({
    schema_version: "v1",
    request_id: "req-preset",
    text: { content: "国家电网董事长在今日发布会上表示，华为将为公司数字化转型提供技术支持。该公司计划在未来三年投入百亿资金。平安证券分析师对此给予积极评价。", language: "zh" },
    mentions: [
      { mention_id: "m1", surface_form: "国家电网", start_offset: 0, end_offset: 4 },
      { mention_id: "m2", surface_form: "华为", start_offset: 14, end_offset: 16 },
      { mention_id: "m3", surface_form: "该公司", start_offset: 25, end_offset: 28 },
      { mention_id: "m4", surface_form: "平安证券", start_offset: 40, end_offset: 44 },
    ],
    knowledge_base: { kb_id: "cn-enterprises-v1", kb_version: "v1" },
    options: { top_k: 5, nil_threshold: 0.6, enable_nil: true, enable_coreference: true, return_candidates: true, return_evidence: true, linker_version: "v1" },
  }, null, 2);
}

async function runLink() {
  const btn = document.getElementById('lk-btn');
  const errEl = document.getElementById('lk-err');
  errEl.style.display = 'none';
  btn.disabled = true; btn.textContent = '处理中...';
  let body;
  try {
    body = JSON.parse(document.getElementById('lk-json').value);
  } catch (e) {
    errEl.textContent = 'JSON 格式错误: ' + e.message;
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = '▶ 执行链接';
    return;
  }
  if (!body.mentions?.length) {
    errEl.textContent = 'mentions 不能为空';
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = '▶ 执行链接';
    return;
  }
  const r = await api('POST', '/api/v1/entity-link', body);
  btn.disabled = false; btn.textContent = '▶ 执行链接';
  renderResult(r);
}

function renderResult({ ok, data }) {
  const el = document.getElementById('lk-result');
  if (!ok) { el.innerHTML = `<div class="result-box err">${JSON.stringify(data,null,2)}</div>`; return; }
  const s = data.summary;
  const chains = data.coreference_chains || [];
  el.innerHTML = `
    <div class="summary-row">
      <span>共 <b>${s.total_mentions}</b> 个 mention</span>
      <span style="color:#1e7e34">linked: <b>${s.linked_count}</b></span>
      <span style="color:#666">nil: <b>${s.nil_count}</b></span>
    </div>
    ${data.results.map(renderCard).join('')}
    ${chains.length ? `<div class="section-lbl">共指链</div>${chains.map(c=>`
      <div class="chain-row"><span class="tag">${c.chain_id}</span>
      ${c.mention_ids.map(m=>`<span class="tag" style="background:#f0f0f0;color:#333">${m}</span>`).join(' → ')}
      → <b>${c.entity_id}</b></div>`).join('')}` : ''}`;
}

function renderCard(r) {
  return `<div class="mention-card">
    <div class="mhead">
      <b>${r.surface_form}</b>
      <span style="color:#aaa;font-size:11px">${r.mention_id}</span>
      <span class="status-badge ${r.link_status}">${r.link_status}</span>
      ${r.entity ? `<span style="font-size:12px">→ <b>${r.entity.canonical_name}</b> <span style="color:#888">${r.entity.entity_id}</span></span>` : ''}
      ${r.confidence ? `<span style="font-size:11px;color:#888;margin-left:auto">置信度 ${r.confidence.toFixed(3)}</span>` : ''}
    </div>
    ${r.coreference ? `<div class="coref-info">↳ 共指回链自 <b>${r.coreference.resolved_from}</b></div>` : ''}
    ${r.evidence?.length ? `<div class="section-lbl">依据</div>${r.evidence.map(e=>`<div class="evid-row"><span class="tag">${e.evidence_type}</span>${e.detail}</div>`).join('')}` : ''}
    ${r.candidates?.length ? `<div class="section-lbl">候选</div>${r.candidates.map(c=>`<div class="cand-row"><span>${c.canonical_name} <span style="color:#aaa">${c.entity_id}</span></span><span>${c.score.toFixed(3)}<span class="score-bar" style="width:${Math.round(c.score*40)}px"></span></span></div>`).join('')}` : ''}
  </div>`;
}

// 启动
checkHealth();
loadKBs();
</script>
</body>
</html>
