[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "entity-link-agent"
version = "0.1.0"
description = "Entity linking and knowledge alignment agent."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<0.116",
  "langchain>=0.3,<0.4",
  "langchain-core>=0.3,<0.4",
  "langgraph>=0.2,<0.3",
  "uvicorn[standard]>=0.30,<0.31",
  "pydantic>=2.7,<2.11",
  "pydantic-settings>=2.3,<3.0",
  "PyYAML>=6.0,<7.0",
  "aiofiles>=23.0,<25.0",
  "sentence-transformers>=3.0,<4.0",
  "faiss-cpu>=1.8,<2.0",
  "numpy>=1.26,<3.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "httpx>=0.27,<0.28"
]

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
include = ["app*"]
