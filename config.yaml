    - "他"
    - "她"
    - "它"
    - "这个人"
    - "该人"
    - "此人"
    - "这位"
    - "这座湖"
    - "该湖"
    - "这片湖"
    - "此湖"
    - "这口井"
    - "该井"
    - "此井"
    - "这眼井"
    - "这座城市"
    - "该城市"
    - "这处景区"
    - "该景区"
    - "该作品"
    - "这部作品"
    - "这部电影"
