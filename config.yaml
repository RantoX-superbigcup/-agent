linker:
  default_top_k: 5
  nil_threshold: 0.6
  ambiguity_margin: 0.08
  enable_nil: true
  enable_coreference: true
  version: "v1"

coreference:
  trigger_terms:
    - "该公司"
    - "该企业"
    - "该机构"
    - "该集团"
    - "其"
    - "他"
    - "她"
    - "它"

storage:
  kb_dir: "data/knowledge_bases"

embedding:
  model_name: "data/models/BAAI/bge-small-zh-v1___5"
  device: "cuda"
  index_dir: "data/vector_index"
  top_k_retrieve: 20
